name: Daily TIL

on:
  schedule:
    # Multiple times per day for resilience: GitHub's scheduler is best-effort and
    # frequently delays runs by hours or skips them. The publish script is
    # idempotent (it no-ops once today's entry exists), so whichever cron fires
    # first publishes and the rest do nothing. Times span the US-Eastern daytime
    # (12:00/16:00/20:00 UTC ≈ 8am/12pm/4pm ET) so the commit lands on the correct
    # day even with several hours of scheduler delay.
    # NOTE: avoid minute :00 — top-of-hour scheduled runs are the most likely to
    # be dropped by GitHub under queue load. Odd minutes + several attempts across
    # the US-Eastern day maximise the chance at least one fires each day.
    - cron: "17 12 * * *"
    - cron: "23 15 * * *"
    - cron: "37 18 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-til
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config user.name "Charan Vamsy"
          git config user.email "charanvamsy1@gmail.com"
      - name: Publish next queued entry
        run: python scripts/publish_daily.py
