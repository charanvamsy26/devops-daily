name: Daily TIL

on:
  schedule:
    # 08:00 UTC daily (~4am ET). Runs in GitHub's cloud — no local machine needed.
    # GitHub may delay scheduled runs under load; the daily commit keeps the repo
    # active so the schedule is not auto-disabled.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-til
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config user.name "Charan Vamsy"
          git config user.email "charanvamsy1@gmail.com"
      - name: Publish next queued entry
        run: python scripts/publish_daily.py
